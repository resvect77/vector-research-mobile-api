name: Mobile Telemetry & Event Engine

on:
  schedule:
    # Runs every 3 hours to capture rolling NOAA SWPC updates persistently
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-mobile-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mobile Database & Event Engine
        run: |
          python space_telemetry_db.py

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-data
          path: |
            mobile_telemetry_feed.json
            vector_telemetry_archive.db
